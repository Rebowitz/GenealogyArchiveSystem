# Phase 0 cross-platform CI: the SAME test suite on native Windows and Linux runners, against the
# minimum supported PostgreSQL (16) and the current release (18). Nothing is skipped by platform.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        postgres: ["16", "18"]
    env:
      LABEL: ${{ matrix.os }} / PostgreSQL ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ---- PostgreSQL --------------------------------------------------------------------------
      - name: Install PostgreSQL ${{ matrix.postgres }} (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci/setup-postgres-linux.sh ${{ matrix.postgres }} 2>&1 | tee ci-postgres.log

      - name: Install PostgreSQL ${{ matrix.postgres }} (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci/setup-postgres-windows.ps1 -Version ${{ matrix.postgres }} *>&1 | Tee-Object -FilePath ci-postgres.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # ---- Fast + Phase-Gate suites via the documented test procedure ---------------------------
      - name: Unit + PostgreSQL integration tests (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/test.sh 2>&1 | tee ci-build.log

      - name: Unit + PostgreSQL integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test.ps1 *>&1 | Tee-Object -FilePath ci-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # ---- Packaged jar, exactly as an administrator runs it ------------------------------------
      - name: Packaged application smoke test (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/smoke-test.sh 2>&1 | tee ci-smoke.log

      - name: Packaged application smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/smoke-test.ps1 *>&1 | Tee-Object -FilePath ci-smoke.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # ---- Native service managers -------------------------------------------------------------
      - name: Native service manager test (systemd)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" bash scripts/ci/service-test-linux.sh 2>&1 | tee ci-service.log

      - name: Native service manager test (Windows service via WinSW)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci/service-test-windows.ps1 *>&1 | Tee-Object -FilePath ci-service.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # ---- Reporting ---------------------------------------------------------------------------
      - name: Annotate failure output
        if: failure()
        shell: bash
        run: $(command -v python3 || command -v python) scripts/ci/annotate-log.py "$LABEL" ci-postgres.log ci-build.log ci-smoke.log ci-service.log

      - name: Test report summary
        if: always()
        shell: bash
        run: $(command -v python3 || command -v python) scripts/ci/test-summary.py "$LABEL"

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-pg${{ matrix.postgres }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            ci-*.log
          if-no-files-found: warn
