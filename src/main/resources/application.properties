# Fixed application defaults. Host-specific settings (database, binding, port, logging location,
# storage roots) come ONLY from the installation configuration file; see config/installation.example.yml.
spring.application.name=genealogy-archive
spring.main.banner-mode=off
spring.jmx.enabled=false

# Migrations are run explicitly by the 'migrate' command, never on startup (ADR-0005).
spring.flyway.enabled=false
spring.sql.init.mode=never

# Web
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.thymeleaf.cache=true
spring.mvc.problemdetails.enabled=true

# Health (Phase 0). Only the health endpoint is exposed over HTTP. Liveness/readiness probe groups
# are web-process settings and are applied by ProcessLauncher.startWeb.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.info.env.enabled=false

# Diagnostic logging. Never log SQL parameter values or request bodies (BUILD-SPEC s.46, SEC-010).
logging.level.root=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=INFO
