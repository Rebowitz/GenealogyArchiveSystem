<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My password')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Change my password</h1>
    <form th:action="@{/account/password}" method="post" class="form">
        <label>Current password <input type="password" name="currentPassword" autocomplete="current-password" required></label>
        <label>New password (at least 12 characters) <input type="password" name="newPassword" autocomplete="new-password" required></label>
        <button type="submit">Change password</button>
    </form>
</main>
</body>
</html>
