<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sources')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Sources</h1>
    <p class="muted">A Source is a record book, register, volume or collection. Its Repository is optional.</p>
    <form th:action="@{/sources/find}" method="get" class="inline">
        <label>Go to Source ID <input type="text" name="id" placeholder="S00001" maxlength="20"></label>
        <button type="submit">Open</button>
    </form>
    <p class="muted" th:if="${#lists.isEmpty(sources)}">No sources yet.</p>
    <table class="list" th:unless="${#lists.isEmpty(sources)}">
        <thead><tr><th>Source</th><th>Title</th><th>Book or volume</th><th>Type</th></tr></thead>
        <tbody>
        <tr th:each="s : ${sources}">
            <td><a th:href="@{/sources/{id}(id=${s.sourceId()})}" th:text="${s.friendlyId()}">S00001</a></td>
            <td th:text="${s.title()}">title</td>
            <td th:text="${s.volumeDesignation()}">volume</td>
            <td th:text="${s.sourceType()}">type</td>
        </tr>
        </tbody>
    </table>
    <section th:if="${canEdit}">
        <h2>New source</h2>
        <form th:action="@{/sources}" method="post" class="form">
            <div th:replace="~{fragments :: sourceFields(${null}, ${repositories})}"></div>
            <button type="submit">Create</button>
        </form>
    </section>
</main>
</body>
</html>
