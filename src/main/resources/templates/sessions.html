<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Capture sessions')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Capture sessions</h1>
    <p class="muted">Context entered once for a visit (repository, source, date, researcher, equipment) and inherited by every File in it.</p>
    <form th:action="@{/sessions/find}" method="get" class="inline">
        <label>Go to session ID <input type="text" name="id" placeholder="CS0001" maxlength="20"></label>
        <button type="submit">Open</button>
    </form>
    <p class="muted" th:if="${#lists.isEmpty(sessions)}">No capture sessions yet.</p>
    <table class="list" th:unless="${#lists.isEmpty(sessions)}">
        <thead><tr><th>Session</th><th>Title</th><th>Capture date</th><th>Researcher</th></tr></thead>
        <tbody>
        <tr th:each="c : ${sessions}">
            <td><a th:href="@{/sessions/{id}(id=${c.captureSessionId()})}" th:text="${c.friendlyId()}">CS0001</a></td>
            <td th:text="${c.title()}">title</td>
            <td th:text="${c.captureDate()}">date</td>
            <td th:text="${c.researcher()}">who</td>
        </tr>
        </tbody>
    </table>
    <section th:if="${canEdit}">
        <h2>New capture session</h2>
        <form th:action="@{/sessions}" method="post" class="form">
            <div th:replace="~{fragments :: sessionFields(${null}, ${repositories}, ${sources})}"></div>
            <button type="submit">Create</button>
        </form>
    </section>
</main>
</body>
</html>
