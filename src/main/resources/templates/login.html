<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Sign in</h1>
    <p class="status problem" th:if="${param.error}">The username or password is not correct, or the account is disabled.</p>
    <p class="status ok" th:if="${param.signedout}">You have signed out.</p>
    <p class="status problem" th:if="${param.ended}">Your session has ended. Please sign in again.</p>
    <form th:action="@{/login}" method="post" class="form">
        <label>Username <input type="text" name="username" autocomplete="username" required autofocus></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
