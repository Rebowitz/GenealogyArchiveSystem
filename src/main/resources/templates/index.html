<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Home')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Genealogy Archive System</h1>
    <p class="subtitle">Archive identity and core (Phase 1). Research features are not yet available.</p>
    <section th:class="${status.ready()} ? 'status ok' : 'status problem'">
        <h2 th:text="${status.ready()} ? 'Archive instance is ready' : 'Archive instance is not ready'">Status</h2>
        <ul class="messages">
            <li th:each="m : ${status.messages()}" th:text="${m}">message</li>
        </ul>
    </section>
    <section th:if="${archive != null}">
        <h2 th:text="${archive.archiveName()}">Archive</h2>
        <table>
            <tr><th>Archive ID</th><td><code th:text="${archive.archiveId()}">id</code></td></tr>
            <tr><th>Initialized</th><td th:text="${archive.createdAt()}">-</td></tr>
        </table>
    </section>
    <section>
        <h2>Foundation status</h2>
        <table>
            <tr><th>Database</th>
                <td th:text="${status.databaseReachable()} ? (${signedIn} ? 'PostgreSQL ' + ${status.databaseVersion()} : 'Available') : 'Unavailable'">-</td></tr>
            <tr><th>Schema</th>
                <td th:text="${status.schema().state()} + (${signedIn} and ${status.schema().currentVersion()} != null ? ' at version ' + ${status.schema().currentVersion()} : '')">-</td></tr>
            <tr><th>Archive</th><td th:text="${status.archive().state()}">-</td></tr>
            <tr th:if="${signedIn}"><th>Application version</th><td th:text="${status.applicationVersion()}">-</td></tr>
            <tr th:if="${signedIn}"><th>Host platform</th><td th:text="${status.host()} + ' (' + ${status.host().serviceManager()} + ')'">-</td></tr>
            <tr><th>Checked</th><td th:text="${status.checkedAt()}">-</td></tr>
        </table>
    </section>
</main>
</body>
</html>
